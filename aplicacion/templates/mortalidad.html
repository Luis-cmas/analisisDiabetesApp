{% extends "consultas.html" %}
{% block mortalidad %}
{% if datos_grafica %}
<div class="container my-4">
    <div class="card shadow-sm p-3">
        <h4 class="card-title text-center fs-5 fw-bold">Tasa de Mortalidad por Diabetes (casos por 100k hab.)</h4>
        
        <!-- Contenedor relativo idéntico al de edad.html -->
        <div style="position: relative; height: 300px; width: 100%;">
            <canvas id="graficaMortalidad"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Recuperar los datos desde Jinja2 pasados a JSON
        const datosGrafica = {{ datos_grafica | tojson }};
        
        const ctx = document.getElementById('graficaMortalidad').getContext('2d');
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: datosGrafica.periodos, // Eje X: Años / Períodos
                datasets: datosGrafica.datasets // Líneas por Alcaldía
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { boxWidth: 12 }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.dataset.label}: ${context.parsed.y} por 100k hab.`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Período (Año)'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Tasa por cada 100,000 habitantes'
                        },
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>
{% endif %}
{% endblock %}
