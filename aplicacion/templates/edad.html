{% extends "consultas.html" %}

{% block edades %}
{% if graficas %}
<div class="container my-4">
    <h3 class="text-center mb-4">Tasa de Casos por Rango de Edad (por 100k Habitantes)</h3>

    <div class="row">
        {% for grafica in graficas %}
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title text-center fs-6 fw-bold">{{ grafica.titulo }}</h5>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="graficaEdad_{{ loop.index }}"></canvas>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Inyectamos las 4 configuraciones de gráficas generadas en Flask
    const graficasData = {{ graficas | tojson }};

    graficasData.forEach((grafica, index) => {
      const canvasId = `graficaEdad_${index + 1}`;
      const ctx = document.getElementById(canvasId).getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: grafica.periodos,
          datasets: grafica.datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12 }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.dataset.label}: ${context.raw} por 100k hab.`;
                }
              }
            }
          },
          scales: {
            x: {
              title: { display: true, text: 'Periodo' }
            },
            y: {
              title: { display: true, text: 'Tasa por 100k' },
              beginAtZero: true
            }
          }
        }
      });
    });
  });
</script>
{% endif %}
{% endblock %}
